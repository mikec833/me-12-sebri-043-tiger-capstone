# Per-node parameters for bringup.launch.py, selected with
#   ./scripts/run_sensors.sh config:=<name>     (config/<name>.yaml)
# This file is used when no config is given. Each top-level key is a
# node name; a node only reads its own block, so settings for any node
# in the launch file can be added here. Launch arguments (ports, run_id)
# still override these.
#
# Lists must be all one type: write 15.0, not 15, in a float list.
# Rebuild (colcon build) after editing, or pass a full path instead:
#   ./scripts/run_sensors.sh config:=/path/to/my.yaml
#
# Shared setup file: also read by ballrobot_localization_pkg
# (localization.launch.py config:=<name>), which takes the UWB anchor layout
# from the uwb_node block below. Optional uwb_pose_adapter, imu_adapter and
# wheel_odom_adapter blocks override that package's config/adapters.yaml for
# this setup. Keep one file per physical setup so both packages agree.

uwb_node:
  ros__parameters:
    # Anchor IDs in the order of anchor_positions below
    anchor_ids: [1, 2, 3]
    # x, y, z (m) per anchor, in the global UWB frame
    anchor_positions: [0.0, 0.0, 1.3,  1.8, 0.0, 1.3,  0.0, 1.8, 1.3]
    tag_below_anchor_plane: true

# Drive interface for firmware v4.7 (teensy_interface_node.py). All values are
# TODO calibrate on the ground inside UWB coverage (navigation brief 2.2,
# robot_navigation_pkg/scripts/calibrate.py). Defaults are deliberately slow:
# p0 and kp come from the wheels-raised motor ID runs (teensy/PI_tune_outputs),
# which under-estimate the loaded deadband.
teensy_interface_node:
  ros__parameters:
    accel_ms: 800       # TODO calibrate. Firmware C ramp up, ms
    brake_ms: 700       # TODO calibrate. Firmware C ramp down, ms
    max_percent: 20     # TODO calibrate. Firmware C output limit, integer %
    r_eff: 0.072        # TODO calibrate. m, effective wheel radius
    b_eff: 0.22         # TODO calibrate. m, effective track
    p0: 3.0             # TODO calibrate. %, deadband offset
    kp: 1.8             # TODO calibrate. % per rad/s of wheel speed
    eps_v: 0.02         # m/s, speeds below this count as zero
