# Indoor anchor layout: equilateral triangle, 4 m sides (a1 origin, a2 on +x, a3 apex at (2, 2*sqrt(3))). Use with:
#   ./scripts/run_sensors.sh config:=indoor_4m_tri
# See default.yaml for the file format.

uwb_node:
  ros__parameters:
    anchor_ids: [1, 2, 3]
    anchor_positions: [0.0, 0.0, 1.39,  4.0, 0.0, 1.39,  2.0, 3.464, 1.39]
    tag_below_anchor_plane: true

feeder_trigger_node:
  ros__parameters:
    # Feeder box (x, y) in the anchor frame above, m. PLACEHOLDER (centre
    # of the anchors) -- measure the real feeder position and update.
    feeder_position: [4.0, 4.0]
    # Send OPEN once the robot's UWB (x, y) is within this distance
    trigger_radius_m: 0.5
    # Leave the zone only beyond trigger_radius_m + this (stops UWB noise
    # at the boundary flipping it on and off)
    exit_margin_m: 0.2
    # Enter/leave only after this many UWB fixes in a row (filters one-off
    # noisy readings)
    confirm_samples: 3

solenoid_release_node:
  ros__parameters:
    # Command written to the feeder-box XIAO over BLE when triggered
    command: OPEN
